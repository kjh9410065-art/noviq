</head><body><main class="wrap"><header><a class="brand" href="/">NOVIQ · 노빅</a><button id="theme" type="button">다크모드</button></header><h1>연봉 인상률 계산기</h1><p class="lead">인상 전후 연봉과 월 세전 급여 차이를 계산합니다.</p><section class="panel"><div class="fields"><label>기존 연봉 (원)<input type="number" inputmode="decimal" step="any" id="v0" value="30000000" required></label><label>변경 연봉 (원)<input type="number" inputmode="decimal" step="any" id="v1" value="33000000" required></label></div><button class="go" id="calc" type="button">계산하기</button><div class="result" id="result" aria-live="polite"></div></section><section class="panel"><h2>계산 기준 및 주의사항</h2><p class="note">세금·4대보험 공제 전 금액입니다.</p><p class="note">입력값을 바꾸어 결과를 비교할 수 있습니다. 결과는 입력한 가정에 따른 참고용 예상값입니다.</p></section><footer><a href="/">← 계산기 전체 보기</a></footer></main><script>const ids=["v0","v1"];const fmt=(n)=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2});function run(){const v=ids.map(id=>Number(document.getElementById(id).value));const out=document.getElementById('result');if(v.some((n,i)=>!Number.isFinite(n)||document.getElementById(ids[i]).value==='')){out.textContent='모든 입력값을 입력하세요.';return}try{if(v.some(n=>n<0))throw Error('음수 입력은 지원하지 않습니다.');const rows=(()=>{if(v[0]<=0)throw Error('기존 연봉은 0보다 커야 합니다.');return [['연봉 인상률',(v[1]-v[0])/v[0]*100,'%'],['연간 증감액',v[1]-v[0],'원'],['월 세전 증감액',(v[1]-v[0])/12,'원']];})();out.innerHTML=rows.map(([label,value,unit])=>'<div><span>'+label+'</span><strong>'+fmt(value)+' '+unit+'</strong></div>').join('')}catch(e){out.textContent=e.message}}document.getElementById('calc').addEventListener('click',run);document.querySelectorAll('input').forEach(e=>e.addEventListener('change',run));const t=document.getElementById('theme');const dark=localStorage.getItem('flick-theme')==='dark';document.documentElement.classList.toggle('dark',dark);t.textContent=dark?'라이트모드':'다크모드';t.addEventListener('click',()=>{const d=document.documentElement.classList.toggle('dark');localStorage.setItem('flick-theme',d?'dark':'light');t.textContent=d?'라이트모드':'다크모드'});run();</script><script src="/favorites.js"></script>
