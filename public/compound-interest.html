<body>
<main class="wrap">
<div class="tools"><button class="theme" id="theme" type="button">🌙 다크모드</button></div>
<div class="brand">NOVIQ</div>
<h1>복리 계산기</h1>
<p class="sub">원금과 이율, 기간을 입력해 복리로 늘어나는 금액을 계산하세요.</p>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<section class="card">
<div class="fields">
<div class="field"><label for="principal">원금</label><input id="principal" type="number" min="0" step="10000" value="10000000" inputmode="decimal"></div>
<div class="field"><label for="rate">연 이율 (%)</label><input id="rate" type="number" min="0" step="0.01" value="4" inputmode="decimal"></div>
<div class="field"><label for="years">기간 (년)</label><input id="years" type="number" min="0" step="0.1" value="5" inputmode="decimal"></div>
</div>
<div class="result">
<div class="row"><span>원금</span><strong id="principalResult">10,000,000원</strong></div>
<div class="row"><span>예상 이자</span><strong id="interestResult">2,208,000원</strong></div>
<div class="row total"><span>예상 만기금액</span><strong id="totalResult">12,208,000원</strong></div>
</div>
<div class="actions"><button class="btn" id="reset" type="button">초기화</button></div>
</section>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<div class="links"><a class="link" href="/calculator-list.html">계산기 목록</a><a class="link" href="/deposit-savings.html">예금·적금 계산기</a></div>
<p class="notice">※ 연 이율을 월 복리로 적용한 단순 예상 계산입니다. 실제 금융상품의 이자 계산 방식, 세금, 우대금리 등에 따라 실제 금액은 달라질 수 있습니다.</p>
</main>
<script>
// 저장된 테마를 불러와 라이트/다크 모드를 유지합니다.
const root=document.documentElement,theme=document.getElementById('theme'),saved=localStorage.getItem('flick-theme');
if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');
function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}
theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});updateTheme();
const principal=document.getElementById('principal'),rate=document.getElementById('rate'),years=document.getElementById('years'),principalResult=document.getElementById('principalResult'),interestResult=document.getElementById('interestResult'),totalResult=document.getElementById('totalResult'),reset=document.getElementById('reset');
function formatWon(value){return `${Math.round(value).toLocaleString('ko-KR')}원`}
function calculate(){
  // 입력값을 숫자로 변환하고 음수는 0으로 보정합니다.
  const p=Math.max(0,Number(principal.value)||0),r=Math.max(0,Number(rate.value)||0),y=Math.max(0,Number(years.value)||0);
  // 연 이율을 월 이율로 바꾸고 전체 기간 동안 월 복리를 적용합니다.
  const months=y*12,monthlyRate=r/100/12;
  const total=monthlyRate===0?p:p*Math.pow(1+monthlyRate,months);
  const interest=total-p;
  principalResult.textContent=formatWon(p);interestResult.textContent=formatWon(interest);totalResult.textContent=formatWon(total);
}
[principal,rate,years].forEach(input=>input.addEventListener('input',calculate));
reset.addEventListener('click',()=>{principal.value=10000000;rate.value=4;years.value=5;calculate()});
calculate();
</script>
<script src="/favorites.js"></script>
