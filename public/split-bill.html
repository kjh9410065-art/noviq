:root{color-scheme:light;--bg:#f5f7fb;--text:#151922;--muted:#667085;--card:#fff;--border:#d9dee8;--primary:#2563eb;--soft:#f8fafc}html.dark{color-scheme:dark;--bg:#0f1115;--text:#f2f4f7;--muted:#98a2b3;--card:#171a21;--border:#353b47;--primary:#4f8cff;--soft:#11141a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:auto;padding:28px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--primary)}.theme,.btn{border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);padding:11px 14px;font-weight:800;cursor:pointer}h1{margin:18px 0 7px;font-size:clamp(30px,8vw,42px)}.sub{margin:0 0 22px;color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:900}.field input{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;background:var(--soft);color:var(--text);font-size:16px}.result{margin-top:18px;padding:17px;border-radius:14px;background:var(--soft);border:1px solid var(--border)}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.row span{color:var(--muted)}.row strong{font-size:18px;text-align:right}.actions{margin-top:12px}.actions .btn{width:100%}.notice{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.65}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.links a{text-decoration:none;color:var(--primary);font-size:13px;font-weight:800}

<body><main class="wrap">
<div class="top"><div class="brand">NOVIQ</div><button class="theme" id="theme" type="button">🌙 다크모드</button></div>
<h1>더치페이 계산기</h1><p class="sub">총 금액과 인원수를 입력하면 1인당 부담 금액을 계산합니다.</p>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<section class="card">
<div class="field"><label for="total">총 금액</label><input id="total" type="number" inputmode="numeric" min="0" step="100" value="100000"></div>
<div class="field"><label for="people">인원수</label><input id="people" type="number" inputmode="numeric" min="1" step="1" value="4"></div>
<div class="result" aria-live="polite">
<div class="row"><span>1인당 부담 금액</span><strong id="perPerson">25,000원</strong></div>
<div class="row"><span>계산식</span><strong id="formula">100,000 ÷ 4</strong></div>
</div>
<div class="actions"><button class="btn" id="reset" type="button">초기화</button></div>
<p class="notice">총 금액을 인원수로 균등하게 나눈 단순 계산입니다. 원 단위에서 나누어떨어지지 않는 경우 1인당 금액은 반올림해 표시합니다.</p>
</section>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<div class="links"><a href="/calculator-list.html">← 계산기 목록</a><a href="/discount.html">할인율 계산기</a></div>
</main><script>
// 저장된 테마를 적용하고, 저장값이 없으면 기기 설정을 따릅니다.
const root=document.documentElement,theme=document.getElementById('theme'),saved=localStorage.getItem('flick-theme');if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});updateTheme();
const total=document.getElementById('total'),people=document.getElementById('people'),perPerson=document.getElementById('perPerson'),formula=document.getElementById('formula');
const money=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function calculate(){const amount=Math.max(0,Number(total.value)||0),count=Math.max(1,Math.floor(Number(people.value)||1));const result=amount/count;perPerson.textContent=money(result);formula.textContent=`${Math.round(amount).toLocaleString('ko-KR')} ÷ ${count}`}
total.addEventListener('input',calculate);people.addEventListener('input',calculate);document.getElementById('reset').addEventListener('click',()=>{total.value=100000;people.value=4;calculate()});calculate();
</script><script src="/favorites.js"></script>
