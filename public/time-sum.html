<body>
<main class="wrap">
<div class="top"><div class="brand">NOVIQ</div><button class="theme" id="theme" type="button">🌙 다크모드</button></div>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<section class="card">
<h1>시간 합산 계산기</h1>
<p class="sub">여러 개의 시간을 한 줄에 하나씩 입력해 총 시간을 계산합니다.</p>
<div class="field"><label for="times">시간 입력</label><textarea id="times" placeholder="예:&#10;1:30&#10;0:45&#10;2:15"></textarea></div>
<div class="actions"><button class="btn primary" id="calculate" type="button">계산하기</button><button class="btn" id="reset" type="button">초기화</button></div>
<div class="result"><div class="value" id="result">총 시간</div><div class="detail" id="detail">시간을 입력하면 합산합니다.</div></div>
<div class="links"><a href="/calculator-list.html">← 계산기 목록</a><a href="/time-duration.html">시간 계산기</a><a href="/date-difference.html">날짜 차이</a></div>
<p class="notice">입력 형식은 시간:분입니다. 예: 1:30 = 1시간 30분. 빈 줄은 무시하며 잘못된 형식은 계산에서 제외합니다.</p>
</section>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
</main>
<script>
const root=document.documentElement,theme=document.getElementById('theme');
// Noviq 전체 페이지에서 다크모드 설정을 유지합니다.
const saved=localStorage.getItem('flick-theme');if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');
function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});updateTheme();
const times=document.getElementById('times'),result=document.getElementById('result'),detail=document.getElementById('detail');
function calculate(){
  // 줄마다 시간:분 형식을 읽어 분 단위로 합산합니다.
  const lines=times.value.split(/\n+/).map(v=>v.trim()).filter(Boolean);let total=0,valid=0;
  lines.forEach(line=>{const match=line.match(/^(\d+)\s*:\s*(\d{1,2})$/);if(!match)return;const h=Number(match[1]),m=Number(match[2]);if(m>=60)return;total+=h*60+m;valid++});
  if(!valid){result.textContent='총 시간';detail.textContent='시간을 입력하면 합산합니다.';return}
  const hours=Math.floor(total/60),minutes=total%60;
  result.textContent=`${hours.toLocaleString('ko-KR')}시간 ${minutes}분`;
  detail.textContent=`유효한 ${valid}개 항목을 합산했습니다. 총 ${total.toLocaleString('ko-KR')}분입니다.`;
}
times.addEventListener('input',calculate);document.getElementById('calculate').addEventListener('click',calculate);
document.getElementById('reset').addEventListener('click',()=>{times.value='';calculate()});
</script>
<script src="/favorites.js"></script>
</body>
