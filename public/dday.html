<body>
<main class="wrap">
<div class="tools"><button class="theme" id="theme" type="button">🌙 다크모드</button></div>
<div class="brand">NOVIQ</div>
<h1>D-day 계산기</h1>
<p class="sub">목표 날짜를 입력하면 오늘을 기준으로 남은 날짜를 계산하세요.</p>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<section class="card">
<div class="field"><label for="target">목표 날짜</label><input id="target" type="date"></div>
<div class="result"><div class="big" id="result">날짜를 선택하세요</div><div class="detail" id="detail">목표 날짜를 입력하면 D-day를 계산합니다.</div></div>
<div class="actions"><button class="btn" id="reset" type="button">초기화</button></div>
</section>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<div class="links"><a class="link" href="/calculator-list.html">계산기 목록</a><a class="link" href="/date-difference.html">날짜 차이 계산기</a></div>
<p class="notice">※ 오늘 날짜와 목표 날짜의 달력상 차이를 기준으로 계산합니다. 목표 날짜 당일은 D-DAY로 표시됩니다.</p>
</main>
<script>
// 저장된 테마를 불러와 라이트/다크 모드를 유지합니다.
const root=document.documentElement,theme=document.getElementById('theme'),saved=localStorage.getItem('flick-theme');
if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');
function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}
theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});updateTheme();
const target=document.getElementById('target'),result=document.getElementById('result'),detail=document.getElementById('detail'),reset=document.getElementById('reset');
function localDate(value){
  // 브라우저의 현지 날짜를 UTC 시간으로 변환해 시간대 차이로 날짜가 어긋나는 것을 막습니다.
  const [y,m,d]=value.split('-').map(Number);return Date.UTC(y,m-1,d);
}
function todayUTC(){
  // 사용자의 기기 기준 오늘 날짜를 YYYY-MM-DD 형태로 만든 뒤 계산에 사용합니다.
  const now=new Date();return Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
}
function calculate(){
  // 목표 날짜와 오늘의 차이를 일 단위로 계산합니다.
  if(!target.value){result.textContent='날짜를 선택하세요';detail.textContent='목표 날짜를 입력하면 D-day를 계산합니다.';return}
  const diff=Math.round((localDate(target.value)-todayUTC())/86400000);
  if(diff===0){result.textContent='D-DAY';detail.textContent='오늘이 목표 날짜입니다.';return}
  const abs=Math.abs(diff),formatted=abs.toLocaleString('ko-KR');
  result.textContent=diff>0?`D-${formatted}`:`D+${formatted}`;
  detail.textContent=diff>0?`목표 날짜까지 ${formatted}일 남았습니다.`:`목표 날짜가 ${formatted}일 지났습니다.`;
}
target.addEventListener('input',calculate);
reset.addEventListener('click',()=>{target.value='';calculate()});
</script>
<script src="/favorites.js"></script>
