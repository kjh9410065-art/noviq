<body>
<main class="wrap">
<div class="tools"><button class="theme" id="theme" type="button">🌙 다크모드</button></div>
<div class="brand">NOVIQ</div>
<h1>나이 계산기</h1>
<p class="sub">생년월일을 입력하면 오늘 기준 만 나이를 계산하세요.</p>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<section class="card">
<div class="field"><label for="birth">생년월일</label><input id="birth" type="date"></div>
<div class="result">
<div class="item"><div class="label">만 나이</div><div class="big" id="age">생년월일을 선택하세요</div><div class="detail" id="ageDetail">오늘 기준 만 나이를 계산합니다.</div></div>
<div class="item"><div class="label">다음 생일</div><div class="big" id="birthday">-</div><div class="detail" id="birthdayDetail">생년월일을 입력하면 계산합니다.</div></div>
</div>
<div class="actions"><button class="btn" id="reset" type="button">초기화</button></div>
</section>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<div class="links"><a class="link" href="/calculator-list.html">계산기 목록</a><a class="link" href="/dday.html">D-day 계산기</a></div>
<p class="notice">※ 만 나이는 생일이 지났는지를 반영해 계산합니다. 미래의 생년월일은 계산하지 않습니다.</p>
</main>
<script>
// 저장된 테마를 불러와 라이트/다크 모드를 유지합니다.
const root=document.documentElement,theme=document.getElementById('theme'),saved=localStorage.getItem('flick-theme');
if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');
function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}
theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});updateTheme();
const birth=document.getElementById('birth'),age=document.getElementById('age'),ageDetail=document.getElementById('ageDetail'),birthday=document.getElementById('birthday'),birthdayDetail=document.getElementById('birthdayDetail'),reset=document.getElementById('reset');
function todayParts(){
  // 사용자의 기기 기준 오늘 날짜를 연·월·일로 가져옵니다.
  const now=new Date();return {year:now.getFullYear(),month:now.getMonth()+1,day:now.getDate()};
}
function utcDate(y,m,d){
  // 날짜만 비교해 시간대 때문에 나이가 하루씩 달라지는 문제를 막습니다.
  return Date.UTC(y,m-1,d);
}
function formatDate(y,m,d){return `${y}년 ${m}월 ${d}일`}
function calculate(){
  // 생년월일이 없으면 결과 영역을 기본 상태로 돌립니다.
  if(!birth.value){age.textContent='생년월일을 선택하세요';ageDetail.textContent='오늘 기준 만 나이를 계산합니다.';birthday.textContent='-';birthdayDetail.textContent='생년월일을 입력하면 계산합니다.';return}
  const [by,bm,bd]=birth.value.split('-').map(Number),today=todayParts();
  const birthTime=utcDate(by,bm,bd),todayTime=utcDate(today.year,today.month,today.day);
  if(birthTime>todayTime){age.textContent='계산할 수 없습니다';ageDetail.textContent='미래 날짜는 생년월일로 입력할 수 없습니다.';birthday.textContent='-';birthdayDetail.textContent='';return}
  // 올해 생일이 지났는지를 확인해 만 나이를 계산합니다.
  let years=today.year-by;if(today.month<bm||(today.month===bm&&today.day<bd))years--;
  age.textContent=`만 ${years}세`;ageDetail.textContent=`출생일: ${formatDate(by,bm,bd)}`;
  // 다음 생일의 연도를 결정하고 다음 생일까지 남은 일수를 계산합니다.
  let nextYear=today.year;if(utcDate(nextYear,bm,bd)<todayTime)nextYear++;
  const nextTime=utcDate(nextYear,bm,bd),days=Math.round((nextTime-todayTime)/86400000);
  birthday.textContent=formatDate(nextYear,bm,bd);
  birthdayDetail.textContent=days===0?'오늘이 생일입니다.':`다음 생일까지 ${days.toLocaleString('ko-KR')}일 남았습니다.`;
}
birth.addEventListener('input',calculate);
reset.addEventListener('click',()=>{birth.value='';calculate()});
</script>
