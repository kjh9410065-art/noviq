<body>
<main class="wrap">
<div class="top"><div class="brand">NOVIQ</div><button class="theme" id="theme" type="button">🌙 다크모드</button></div>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
<section class="card">
<h1>평균 계산기</h1>
<p class="sub">여러 숫자를 입력하면 합계와 개수, 평균을 계산합니다.</p>
<label class="label" for="numbers">숫자 입력</label>
<textarea id="numbers" placeholder="예: 10, 20, 30, 40, 50"></textarea>
<p class="hint">쉼표, 공백, 줄바꿈으로 숫자를 구분할 수 있습니다.</p>
<div class="actions"><button class="btn primary" id="calculate" type="button">계산하기</button><button class="btn" id="reset" type="button">초기화</button></div>
<div class="result"><div class="value" id="average">평균</div><div class="detail" id="detail">숫자를 입력하면 계산 결과가 표시됩니다.</div></div>
<div class="links"><a href="/calculator-list.html">← 계산기 목록</a><a href="/percent.html">퍼센트 계산기</a><a href="/ratio.html">비율 계산기</a></div>
<p class="notice">입력한 숫자의 산술평균을 계산합니다. 반올림된 값은 화면 표시용입니다.</p>
</section>
<div class="ad-slot" aria-label="광고 영역">광고 영역</div>
</main>
<script>
const root=document.documentElement,theme=document.getElementById('theme');
// Noviq 전체 페이지에서 다크모드 설정을 유지합니다.
const saved=localStorage.getItem('flick-theme');
if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');
function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}
theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});
updateTheme();
const numbers=document.getElementById('numbers'),average=document.getElementById('average'),detail=document.getElementById('detail');
function calculate(updateUrl=true){
  // 빈 항목을 먼저 제거한 뒤 숫자로 변환해 빈 입력을 0으로 잘못 계산하지 않습니다.
  const values=numbers.value.split(/[\s,]+/).map(value=>value.trim()).filter(value=>value!=='').map(value=>Number(value)).filter(value=>Number.isFinite(value));
  if(!values.length){average.textContent='평균';detail.textContent='계산할 숫자를 입력하세요.';return}
  const sum=values.reduce((total,value)=>total+value,0);
  const mean=sum/values.length;
  average.textContent=mean.toLocaleString('ko-KR',{maximumFractionDigits:6});
  detail.textContent=`합계 ${sum.toLocaleString('ko-KR',{maximumFractionDigits:6})} · ${values.length}개 숫자`;
  if(updateUrl){const params=new URLSearchParams();if(numbers.value)params.set('numbers',numbers.value);history.replaceState(null,'',params.toString()?`${location.pathname}?${params}`:location.pathname)}
}
// 공유된 주소의 입력값이 있으면 자동으로 복원합니다.
const params=new URLSearchParams(location.search);if(params.has('numbers'))numbers.value=params.get('numbers');
numbers.addEventListener('input',()=>calculate(false));
document.getElementById('calculate').addEventListener('click',()=>calculate(true));
document.getElementById('reset').addEventListener('click',()=>{numbers.value='';history.replaceState(null,'',location.pathname);calculate(false)});
calculate(false);
</script>
<script src="/favorites.js"></script>
</body>
