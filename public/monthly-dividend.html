<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>월배당 계산기 | NOVIQ</title><meta name="description" content="연 분배율로 예상 월분배금과 목표 투자금을 계산합니다."><link rel="canonical" href="https://noviq.tcflick.com/monthly-dividend.html"><style>:root{--bg:#f5f7fb;--card:#fff;--text:#151922;--muted:#667085;--border:#e4e7ec;--primary:#2563eb}html.dark{--bg:#0f1115;--card:#171a21;--text:#f2f4f7;--muted:#98a2b3;--border:#2b303a;--primary:#4f8cff;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:740px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center}a{color:var(--primary)}.brand{font-weight:900;text-decoration:none}button{cursor:pointer;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);padding:10px 15px}h1{margin:32px 0 8px;font-size:28px}.lead,.note{color:var(--muted);line-height:1.75}.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-top:22px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{font-size:13px;font-weight:700;display:block}input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}.go{width:100%;background:var(--primary);color:white;border:0;margin-top:20px;font-size:16px;font-weight:700}.result{margin-top:20px}.result div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:14px 0}.result strong{text-align:right}footer{margin-top:30px;font-size:13px}@media(max-width:550px){.fields{grid-template-columns:1fr}}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6943939077344765" crossorigin="anonymous"></script></head><body><main class="wrap"><header><a class="brand" href="/">NOVIQ · 노빅</a><button id="theme" type="button">다크모드</button></header><h1>월배당 계산기</h1><p class="lead">연 분배율로 예상 월분배금과 목표 투자금을 계산합니다.</p><section class="panel"><div class="fields"><label>투자금 (원)<input type="number" inputmode="decimal" step="any" id="v0" value="10000000" required></label><label>연 분배율 (%)<input type="number" inputmode="decimal" step="any" id="v1" value="5" required></label><label>원천징수 가정 (%)<input type="number" inputmode="decimal" step="any" id="v2" value="15.4" required></label><label>목표 세후 월분배금 (원)<input type="number" inputmode="decimal" step="any" id="v3" value="300000" required></label></div><button class="go" id="calc" type="button">계산하기</button><div class="result" id="result" aria-live="polite"></div></section><section class="panel"><h2>계산 기준 및 주의사항</h2><p class="note">분배금은 확정 수익이 아니며 과세 방식은 상품·계좌에 따라 다릅니다.</p><p class="note">입력값을 바꾸어 결과를 비교할 수 있습니다. 결과는 입력한 가정에 따른 참고용 예상값입니다.</p></section><footer><a href="/">← 계산기 전체 보기</a></footer></main><script>const ids=["v0","v1","v2","v3"];const fmt=(n)=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2});function run(){const v=ids.map(id=>Number(document.getElementById(id).value));const out=document.getElementById('result');if(v.some((n,i)=>!Number.isFinite(n)||document.getElementById(ids[i]).value==='')){out.textContent='모든 입력값을 입력하세요.';return}try{if(v.some(n=>n<0))throw Error('음수 입력은 지원하지 않습니다.');const rows=(()=>{const rate=v[1]/100,tax=v[2]/100;if(rate<=0||tax>=1)throw Error('분배율과 세율을 확인하세요.');const gross=v[0]*rate/12,net=gross*(1-tax);return [['예상 세전 월분배금',gross,'원'],['예상 세후 월분배금',net,'원'],['목표 투자금',v[3]*12/rate/(1-tax),'원']];})();out.innerHTML=rows.map(([label,value,unit])=>'<div><span>'+label+'</span><strong>'+fmt(value)+' '+unit+'</strong></div>').join('')}catch(e){out.textContent=e.message}}document.getElementById('calc').addEventListener('click',run);document.querySelectorAll('input').forEach(e=>e.addEventListener('change',run));const t=document.getElementById('theme');const dark=localStorage.getItem('flick-theme')==='dark';document.documentElement.classList.toggle('dark',dark);t.textContent=dark?'라이트모드':'다크모드';t.addEventListener('click',()=>{const d=document.documentElement.classList.toggle('dark');localStorage.setItem('flick-theme',d?'dark':'light');t.textContent=d?'라이트모드':'다크모드'});run();</script></body></html>
