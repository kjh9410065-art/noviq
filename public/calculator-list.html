<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>계산기 목록 | Noviq</title>
<meta name="description" content="연봉, 퇴직금, 연차수당, 주휴수당, 시급, 부가세, 종합소득세, 퍼센트, 비율, 할인율, 더치페이, 대출, 예금·적금, 복리, 투자 수익률, 날짜·시간 계산기를 한곳에서 이용하세요.">
<link rel="canonical" href="https://noviq.tcflick.com/calculator-list.html">
<style>
:root{color-scheme:light;--bg:#f5f7fb;--text:#151922;--muted:#667085;--card:#fff;--border:#d9dee8;--primary:#2563eb}html.dark{color-scheme:dark;--bg:#0f1115;--text:#f2f4f7;--muted:#98a2b3;--card:#171a21;--border:#2b303a;--primary:#4f8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:auto;padding:28px 0 48px}.tools{display:flex;justify-content:flex-end}.theme{border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);padding:9px 13px;font-weight:800;cursor:pointer}.brand{margin-top:18px;font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--primary)}h1{margin:10px 0 7px;font-size:clamp(30px,8vw,42px)}.sub{margin:0 0 16px;color:var(--muted);font-size:14px}.ad-slot{min-height:90px;margin:18px 0;border:1px dashed var(--border);border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;letter-spacing:.05em}.search{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px}.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;border:2px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);padding:10px 15px;font-size:13px;font-weight:900;cursor:pointer}.filter.active{background:var(--primary);border-color:var(--primary);color:#fff}.count{margin:0 0 12px;color:var(--muted);font-size:12px}.grid{display:grid;gap:12px}.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:19px}.category{font-size:11px;font-weight:900;color:var(--primary);letter-spacing:.05em}.title{margin-top:6px;font-size:19px;font-weight:900}.desc{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}.arrow{margin-top:13px;font-size:13px;font-weight:800;color:var(--primary)}.empty{text-align:center;padding:32px 16px;color:var(--muted);border:1px dashed var(--border);border-radius:18px;display:none}.empty.show{display:block}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M803R1ZV5P"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-M803R1ZV5P');
</script>
</head>
<body><main class="wrap"><div class="tools"><button class="theme" id="theme" type="button">🌙 다크모드</button></div><div class="brand">NOVIQ</div><h1>계산기 모음</h1><p class="sub">원하는 계산기를 검색하거나 카테고리로 빠르게 찾아보세요.</p><div class="ad-slot" aria-label="광고 영역">광고 영역</div><input class="search" id="search" type="search" placeholder="🔍 계산기 검색" aria-label="계산기 검색"><div class="filters" id="filters" role="group" aria-label="계산기 카테고리"></div><p class="count" id="count">계산기를 불러오는 중...</p><section class="grid" id="grid" aria-label="계산기 목록"></section><div class="ad-slot" aria-label="광고 영역">광고 영역</div><div class="empty" id="empty">검색 조건에 맞는 계산기가 없습니다.</div></main>
<script>
const root=document.documentElement,theme=document.getElementById('theme');
const saved=localStorage.getItem('flick-theme');if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});updateTheme();
const search=document.getElementById('search'),filters=document.getElementById('filters'),grid=document.getElementById('grid'),count=document.getElementById('count'),empty=document.getElementById('empty');let calculators=[],active='전체';
async function load(){try{const response=await fetch('/calculators.json',{cache:'no-store'});if(!response.ok)throw new Error('registry');const data=await response.json();calculators=data.calculators.filter(item=>item.status==='active');renderFilters();render();}catch(error){count.textContent='계산기 목록을 불러오지 못했습니다.';empty.textContent='계산기 목록을 불러오지 못했습니다.';empty.classList.add('show')}}
function renderFilters(){filters.innerHTML='';const categories=['전체',...new Set(calculators.map(item=>item.category))];categories.forEach(category=>{const button=document.createElement('button');button.className='filter'+(category===active?' active':'');button.type='button';button.textContent=category;button.addEventListener('click',()=>{active=category;renderFilters();render()});filters.appendChild(button)})}
function render(){grid.innerHTML='';const keyword=search.value.trim().toLowerCase();const visible=calculators.filter(item=>{const categoryMatch=active==='전체'||item.category===active;const text=`${item.name} ${item.description} ${item.category}`.toLowerCase();return categoryMatch&&(!keyword||text.includes(keyword))});visible.forEach(item=>{const link=document.createElement('a');link.className='card';link.href=item.url;link.innerHTML=`<div class="category">${item.category}</div><div class="title">${item.name}</div><div class="desc">${item.description}</div><div class="arrow">${item.name} →</div>`;grid.appendChild(link)});count.textContent=`전체 ${calculators.length}개 중 ${visible.length}개 표시`;empty.classList.toggle('show',visible.length===0)}
search.addEventListener('input',render);load();
</script><script src="/favorites.js"></script></body></html>
