name: Verify NOVIQ calculators
on:
  push:
    paths:
      - 'public/**'
      - 'scripts/verify-calculators.mjs'
      - '.github/workflows/verify-calculators.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calculator pages and example results
        run: node scripts/verify-calculators.mjs
