name: Apply Google Analytics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[analytics-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add Google Analytics to all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('public')
          snippet = '''\n<!-- Google tag (gtag.js) -->\n<script async src="https://www.googletagmanager.com/gtag/js?id=G-M803R1ZV5P"></script>\n<script>\n  window.dataLayer = window.dataLayer || [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag('js', new Date());\n  gtag('config', 'G-M803R1ZV5P');\n</script>\n'''

          changed = 0
          for path in sorted(root.glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if 'G-M803R1ZV5P' in text:
                  continue
              if '</head>' not in text:
                  continue
              text = text.replace('</head>', snippet + '</head>', 1)
              path.write_text(text, encoding='utf-8')
              changed += 1
          print(f'Google Analytics added to {changed} HTML pages.')
          PY
      - name: Commit Analytics patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Google Analytics tracking [analytics-patch]"
          git push
