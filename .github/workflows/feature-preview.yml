name: NOVIQ isolated preview
on:
  push:
    branches: ['preview/all-features-20261026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check preview has financial controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('feature-preview.html').read_text()
          for v in ['id="graph"','id="store"','id="csv"','id="copy"','id="print"','noindex,nofollow','@media(max-width:520px)']:
              assert v in s,v
          print('NOVIQ preview static checks passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: noviq-feature-preview
          path: feature-preview.html
          retention-days: 14
